# pcsx-abnxt's in-game menu look (docs/skin.md): key = value, '#' starts a comment line.
# Colours are RRGGBB (or #RRGGBB), alphas 0..255, file names are files in this folder.
# A missing key or a bad value keeps the built-in value; these are the built-in values (ab2.0.0).

# text
text = f4f6f8
name = d6dde6
dim = 9aa4b2
grey = 5c6674
shadow = 0c0f13

# panels and the selection
accent = 36d9e0
panel = 262e38
panel_alpha = 220
row = 481a36
row_alpha = 200
select_rim = ff46aa

# the pad glyphs of the hint bar
hint_disc = 3a3a3e
hint_rim = 59595d
hint_cross = 6d7df6
hint_circle = e44e74

# files
background = ab_background.jpg
font = ui.ttf
# the menu's text sizes for this font, percent (Red Hat Text's glyphs are ~9 % smaller at the same size)
text_scale = 110
# the in-game HUD's text size for this font, percent (the same reason)
hud_scale = 110
